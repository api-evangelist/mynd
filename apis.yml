description: Mynd is a tech-enabled property management and real estate investing company offering
  full-service management for single-family rental (SFR) homes. It manages more than 20,000 homes
  across 40-plus U.S. markets, handling tenant screening, leasing, rent collection, maintenance, and
  portfolio management for individual and institutional investors, and provides a proprietary Investor
  Portal for real-time portfolio visibility. Mynd is owned by Roofstock and integrates with partner
  platforms such as Stessa. As of this enrichment pass Mynd publishes no public developer API, API
  documentation, developer portal, or /.well-known discovery surface; this profile remains a
  company/portfolio lead with no API artifacts to harvest.
